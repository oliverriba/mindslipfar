<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I WATCHED YOU AS YOUR MIND SLIPPED FAR (AWAY FROM ME)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #0a0a0f;
    --darkgreen: #0d1a0d;
    --green: #1a3a1a;
    --midgreen: #2a5a2a;
    --palegreen: #4a8a4a;
    --fog: #1a2a1a;
    --gold: #c8a84b;
    --dull-gold: #7a6020;
    --white: #e8e0d0;
    --red: #8a2020;
    --sun1: #ff6b00;
    --sun2: #ff3300;
    --sun3: #ffcc00;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    display: flex; align-items: center; justify-content: center;
    font-family: 'VT323', monospace;
    overflow: hidden;
    cursor: none;
  }

  #game-wrapper {
    position: relative;
    width: 640px;
    height: 480px;
    overflow: hidden;
    image-rendering: pixelated;
    border: 2px solid #1a2a1a;
    box-shadow: 0 0 60px rgba(0,80,0,0.3), 0 0 120px rgba(0,40,0,0.2);
  }

  canvas {
    display: block;
    width: 640px;
    height: 480px;
    image-rendering: pixelated;
  }

  /* CRT overlay */
  #crt {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
    animation: flicker 8s infinite;
    z-index: 10;
  }

  #crt::after {
    content: '';
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.92; }
    97% { opacity: 1; }
    98% { opacity: 0.88; }
  }

  #cursor {
    position: fixed;
    width: 12px; height: 12px;
    pointer-events: none;
    z-index: 100;
    transform: translate(-50%, -50%);
  }

  /* UI text overlay */
  #ui {
    position: absolute; bottom: 0; left: 0; width: 100%;
    padding: 8px 12px;
    background: rgba(0,0,0,0.85);
    border-top: 1px solid #1a3a1a;
    z-index: 5;
    min-height: 60px;
    display: flex; align-items: center;
  }

  #ui-text {
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--white);
    line-height: 1.3;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 0.3s;
  }

  #ui-text.visible { opacity: 1; }

  #inventory {
    position: absolute; top: 8px; right: 8px;
    z-index: 5;
    display: flex; gap: 6px;
  }

  .inv-slot {
    width: 36px; height: 36px;
    border: 1px solid #2a4a2a;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
  }

  #scene-label {
    position: absolute; top: 8px; left: 8px;
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: #2a5a2a;
    z-index: 5;
    letter-spacing: 0.1em;
  }

  /* Title screen */
  #title-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--black);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20;
    cursor: none;
  }

  #title-screen h1 {
    font-family: 'VT323', monospace;
    font-size: 28px;
    color: var(--white);
    text-align: center;
    line-height: 1.4;
    letter-spacing: 0.15em;
    max-width: 500px;
    margin-bottom: 40px;
    animation: pulse-text 4s ease-in-out infinite;
  }

  @keyframes pulse-text {
    0%, 100% { color: #e8e0d0; text-shadow: 0 0 10px rgba(200,168,75,0.1); }
    50% { color: #c8a84b; text-shadow: 0 0 20px rgba(200,168,75,0.4); }
  }

  #title-screen .subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #2a5a2a;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 60px;
  }

  #start-btn {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--palegreen);
    background: none;
    border: 1px solid #2a5a2a;
    padding: 8px 30px;
    cursor: none;
    letter-spacing: 0.2em;
    transition: all 0.2s;
  }

  #start-btn:hover {
    background: #0d1a0d;
    color: var(--gold);
    border-color: var(--dull-gold);
    box-shadow: 0 0 15px rgba(200,168,75,0.2);
  }

  /* End screen */
  #end-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: white;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 30;
    animation: end-fade 3s forwards;
  }

  @keyframes end-fade {
    0% { background: white; }
    60% { background: white; }
    100% { background: #0a0a0f; }
  }

  #end-screen p {
    font-family: 'VT323', monospace;
    font-size: 26px;
    color: transparent;
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
    animation: end-text 3s forwards;
    animation-delay: 1.5s;
  }

  @keyframes end-text {
    0% { color: transparent; }
    100% { color: #e8e0d0; }
  }

  #end-screen .end-restart {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: transparent;
    letter-spacing: 0.3em;
    margin-top: 40px;
    animation: end-text 2s forwards;
    animation-delay: 4s;
    cursor: none;
  }

  #end-screen .end-restart:hover { color: #4a8a4a; }
</style>
</head>
<body>

<!-- Custom cursor -->
<svg id="cursor" viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
  <rect x="5" y="0" width="2" height="12" fill="#4a8a4a"/>
  <rect x="0" y="5" width="12" height="2" fill="#4a8a4a"/>
</svg>

<div id="game-wrapper">
  <canvas id="canvas" width="640" height="420"></canvas>

  <div id="scene-label">SCENE 1 / 4</div>

  <div id="inventory">
    <div class="inv-slot" id="inv-key" title=""></div>
    <div class="inv-slot" id="mute-btn" title="toggle audio" style="cursor:none; font-family:'VT323',monospace; font-size:18px; color:#2a5a2a; user-select:none;">♪</div>
  </div>

  <div id="ui">
    <div id="ui-text"></div>
  </div>

  <!-- Video clip overlay — rapid cuts after rainbow -->
  <div id="video-overlay" style="
    position:absolute; top:0; left:0; width:100%; height:100%;
    z-index:8; display:none; background:#000; overflow:hidden;
  ">
    <video id="video-player" style="
      width:100%; height:100%; object-fit:cover;
      image-rendering:pixelated;
    " playsinline muted></video>
    <div id="video-fade" style="
      position:absolute; top:0; left:0; width:100%; height:100%;
      background:#000; opacity:0; pointer-events:none;
      transition: opacity 0s;
    "></div>
  </div>

  <div id="crt"></div>

  <!-- Title -->
  <div id="title-screen">
    <h1>I WATCHED YOU AS YOUR MIND SLIPPED FAR<br>(AWAY FROM ME)</h1>
    <div class="subtitle">a short game by MORN</div>
    <button id="start-btn">[ ENTER THE FOREST ]</button>
  </div>

  <!-- End -->
  <div id="end-screen">
    <p id="end-text">there you are.</p>
    <div class="end-restart" id="restart-btn">[ press anywhere to begin again ]</div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  scene: 0,        // 0=forest, 1=clearing, 2=door, 3=fall
  hasKey: false,
  message: '',
  messageTimer: 0,
  hovered: null,
  sunPhase: 0,
  fallY: 0,
  fragments: [],
  shake: 0,
};

// ─── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ─── Mouse ────────────────────────────────────────────────────────────────────
let mx = 320, my = 210;
const wrapper = document.getElementById('game-wrapper');
const cursorEl = document.getElementById('cursor');

document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top = e.clientY + 'px';
  const rect = wrapper.getBoundingClientRect();
  mx = (e.clientX - rect.left) * (640 / rect.width);
  my = (e.clientY - rect.top) * (420 / rect.height);
});

// ─── UI Text ──────────────────────────────────────────────────────────────────
const uiEl = document.getElementById('ui-text');
let uiTimeout;
function showMessage(msg, duration = 3500) {
  uiEl.textContent = msg;
  uiEl.classList.add('visible');
  clearTimeout(uiTimeout);
  if (duration > 0) {
    uiTimeout = setTimeout(() => uiEl.classList.remove('visible'), duration);
  }
}

// ─── Scenes ───────────────────────────────────────────────────────────────────
const SCENES = ['THE DARK FOREST', 'A CLEARING', 'THE DOOR', 'THE SUN'];
const sceneLabel = document.getElementById('scene-label');

function setScene(s) {
  state.scene = s;
  sceneLabel.textContent = `SCENE ${s+1} / 4 — ${SCENES[s]}`;
  state.fragments = [];
}

// ─── Clickables per scene ─────────────────────────────────────────────────────
const clickables = {
  0: [ // Forest
    { x:100, y:140, w:60, h:80, id:'tree1', label:'a tree. its bark is wrong.',
      action() { showMessage('you press your hand to it. it doesn\'t feel like bark should.'); } },
    { x:290, y:200, w:40, h:40, id:'strange-light', label:'something glowing...',
      action() { showMessage('you can\'t reach it yet. you need to go deeper.'); } },
    { x:480, y:160, w:50, h:70, id:'tree2', label:'another tree.',
      action() { showMessage('i kept your number in my phone.', 4000); } },
    { x:0, y:0, w:0, h:0, id:'path', isPath:true, label:'walk forward',
      action() { setScene(1); showMessage('you walk until the trees thin out.'); } },
  ],
  1: [ // Clearing
    { x:300, y:250, w:24, h:24, id:'key', label:'the key.',
      action() {
        if (!state.hasKey) {
          state.hasKey = true;
          drawInvKey();
          showMessage('you pick it up. it\'s warm. it was always warm.', 4000);
        } else {
          showMessage('you\'re already holding it.');
        }
      }
    },
    { x:80, y:200, w:30, h:80, id:'stump', label:'an old stump.',
      action() { showMessage('something used to grow here.'); } },
    { x:500, y:180, w:40, h:100, id:'tall-tree', label:'a tree that reaches.',
      action() { showMessage('you used to call it tuesday.', 4000); } },
    { x:140, y:320, w:120, h:34, id:'back', label:'[ ← go back ]',
      action() { setScene(0); showMessage('you return to where you started.'); } },
    { x:380, y:320, w:160, h:34, id:'forward', label: '[ continue → ]',
      action() {
        if (!state.hasKey) {
          showMessage('you feel like you\'re forgetting something. something on the ground...');
        } else {
          setScene(2);
          showMessage('there it is. you knew it would be here.');
        }
      }
    },
  ],
  2: [ // Door
    { x:260, y:100, w:120, h:240, id:'door', label:'the door.',
      action() {
        if (!state.hasKey) {
          showMessage('it won\'t open. not yet.');
        } else if (!state.doorOpening) {
          state.doorOpening = true;
          showMessage('the key fits. of course it does.', 2000);
          setTimeout(() => {
            showMessage('you open it.', 1500);
            setTimeout(() => {
              setScene(3);
              state.fallY = 0;
              state.sunPhase = 0;
              spawnFragments();
              showMessage('', 0);
              stopAmbient(3000); // fade out eerie loop
              playSong();        // fade in the song
            }, 2000);
          }, 2200);
        }
      }
    },
    { x:60, y:320, w:140, h:34, id:'back2', label:'[ ← turn back ]',
      action() { setScene(1); showMessage('you step back. the door waits.'); } },
  ],
  3: [], // Fall — no clickables, auto-plays
};

// ─── Audio system ─────────────────────────────────────────────────────────────
// AMBIENT: looping eerie soundtrack for forest/clearing/door scenes
// Drop your file in audio/ and update the filename below:
const AMBIENT_FILE = 'audio/ambient.mp3'; // ← your eerie loop goes here

// SONG: plays during the sun/fall sequence
const SONG_FILE = 'audio/song.mp3';       // ← your song goes here

const audio = {
  song:           null,
  songReady:      false,
  songPlaying:    false,
  ambient:        null,
  ambientReady:   false,
  ambientPlaying: false,
  muted:          false,
};

function initAudio() {
  // --- ambient ---
  if (!audio.ambient) {
    const amb = new Audio(AMBIENT_FILE);
    amb.loop    = true;
    amb.volume  = 0;
    amb.preload = 'auto';
    amb.addEventListener('canplaythrough', () => { audio.ambientReady = true; });
    amb.addEventListener('error', () => { audio.ambientReady = false; });
    audio.ambient = amb;
  }

  // --- song ---
  if (!audio.song) {
    const sng = new Audio(SONG_FILE);
    sng.loop    = false;
    sng.volume  = 0;
    sng.preload = 'auto';
    sng.addEventListener('canplaythrough', () => { audio.songReady = true; });
    sng.addEventListener('error', () => { audio.songReady = false; });
    audio.song = sng;
  }
}

function playAmbient() {
  if (!audio.ambient || !audio.ambientReady || audio.ambientPlaying) return;
  audio.ambient.currentTime = 0;
  audio.ambient.volume = 0;
  audio.ambient.muted = audio.muted;
  audio.ambient.play().then(() => {
    audio.ambientPlaying = true;
    fadeAudioIn(audio.ambient, 0.6, 4000); // gentle fade in over 4s
  }).catch(() => {});
}

function stopAmbient(fadeDuration = 3000) {
  if (!audio.ambient || !audio.ambientPlaying) return;
  fadeAudioOut(audio.ambient, fadeDuration, () => {
    audio.ambient.pause();
    audio.ambientPlaying = false;
  });
}

function playSong() {
  if (!audio.song || !audio.songReady || audio.songPlaying) return;
  audio.song.currentTime = 0;
  audio.song.volume = 0;
  audio.song.muted = audio.muted;
  audio.song.play().then(() => {
    audio.songPlaying = true;
    fadeAudioIn(audio.song, 1.0, 3000);
  }).catch(() => {});
}

function stopSong(fadeDuration = 2000) {
  if (!audio.song || !audio.songPlaying) return;
  fadeAudioOut(audio.song, fadeDuration, () => {
    audio.song.pause();
    audio.song.currentTime = 0;
    audio.songPlaying = false;
  });
}

function fadeAudioIn(el, targetVol, duration) {
  const steps = 40;
  const interval = duration / steps;
  const increment = targetVol / steps;
  let step = 0;
  const timer = setInterval(() => {
    step++;
    el.volume = Math.min(el.volume + increment, targetVol);
    if (step >= steps) clearInterval(timer);
  }, interval);
}

function fadeAudioOut(el, duration, onDone) {
  const steps = 40;
  const interval = duration / steps;
  const startVol = el.volume;
  const decrement = startVol / steps;
  let step = 0;
  const timer = setInterval(() => {
    step++;
    el.volume = Math.max(el.volume - decrement, 0);
    if (step >= steps) { clearInterval(timer); if (onDone) onDone(); }
  }, interval);
}


function drawInvKey() {
  const slot = document.getElementById('inv-key');
  slot.innerHTML = `<svg width="24" height="24" viewBox="0 0 8 8">
    <circle cx="3" cy="3" r="2" fill="none" stroke="#c8a84b" stroke-width="1"/>
    <rect x="4.5" y="2.5" width="3" height="1" fill="#c8a84b"/>
    <rect x="5.5" y="3.5" width="1" height="1.5" fill="#c8a84b"/>
    <rect x="7" y="3.5" width="1" height="1" fill="#c8a84b"/>
  </svg>`;
}

// Rainbow flash zone and total duration
const RAINBOW_START = 2800;
const RAINBOW_END   = 2920;
const TOTAL_TICKS   = 2960; // fires ~40 ticks after rainbow ends

function spawnFragments() {
  state.fragments = []; // no lyrics — pure visual
}

// ─── Drawing utilities ────────────────────────────────────────────────────────

function drawForest(t) {
  // sky / fog
  const grad = ctx.createLinearGradient(0, 0, 0, 420);
  grad.addColorStop(0, '#050a05');
  grad.addColorStop(1, '#0d1a0d');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 640, 420);

  // moon glow
  ctx.save();
  ctx.globalAlpha = 0.15;
  const moonGrad = ctx.createRadialGradient(320, 60, 0, 320, 60, 120);
  moonGrad.addColorStop(0, '#c8e8c8');
  moonGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = moonGrad;
  ctx.fillRect(0, 0, 640, 420);
  ctx.restore();

  // ground
  ctx.fillStyle = '#080e08';
  ctx.fillRect(0, 340, 640, 80);
  ctx.fillStyle = '#0d1a0d';
  ctx.fillRect(0, 335, 640, 8);

  // trees
  const treePositions = [
    [50,  400, 60, 220],
    [130, 420, 50, 200],
    [220, 410, 45, 210],
    [350, 430, 55, 230],
    [430, 415, 48, 205],
    [520, 400, 62, 225],
    [590, 430, 44, 195],
    [10,  440, 40, 190],
    [680, 440, 50, 200],
  ];

  // subtle sway
  const sway = Math.sin(t / 3000) * 2;

  treePositions.forEach(([bx, by, bw, bh]) => {
    // trunk
    ctx.fillStyle = '#0a0f0a';
    ctx.fillRect(bx + bw/2 - 5 + sway * 0.3, by - bh, 10, bh);
    // foliage layers
    [[0, 0, '#0d1a0d'], [0, -20, '#101e10'], [0, -35, '#0f1c0f']].forEach(([ox, oy, col], li) => {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(bx + bw/2 + sway * (li+1) * 0.4, by - bh + oy - 30);
      ctx.lineTo(bx - 10 + ox, by - bh + oy + 60);
      ctx.lineTo(bx + bw + 10 + ox, by - bh + oy + 60);
      ctx.closePath();
      ctx.fill();
    });
  });

  // path — highlights on hover
  const pathHovered = state.scene === 0 && pointInPath(mx, my);
  ctx.fillStyle = pathHovered ? '#183018' : '#0f1c0f';
  ctx.beginPath();
  ctx.moveTo(240, 420);
  ctx.lineTo(280, 335);
  ctx.lineTo(360, 335);
  ctx.lineTo(400, 420);
  ctx.closePath();
  ctx.fill();

  if (pathHovered) {
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = '#4a8a4a';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  // subtle path label — just a hint, clicking the path itself works
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.15 * Math.sin(t / 1200);
  ctx.font = '15px VT323, monospace';
  ctx.fillStyle = '#4a8a4a';
  ctx.textAlign = 'center';
  ctx.fillText('▲  walk forward  ▲', 320, 360);
  ctx.restore();

  // mist layers
  for (let i = 0; i < 3; i++) {
    const mistX = ((t * (0.02 + i * 0.01)) % 700) - 50;
    ctx.save();
    ctx.globalAlpha = 0.04 + i * 0.02;
    const mistGrad = ctx.createLinearGradient(mistX, 0, mistX + 200, 0);
    mistGrad.addColorStop(0, 'transparent');
    mistGrad.addColorStop(0.5, '#1a3a1a');
    mistGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = mistGrad;
    ctx.fillRect(0, 280 + i * 20, 640, 40);
    ctx.restore();
  }

  // glowing orb (scene 0 only hint)
  if (state.scene === 0) {
    const pulse = 0.5 + 0.5 * Math.sin(t / 800);
    ctx.save();
    ctx.globalAlpha = 0.3 + pulse * 0.3;
    const orbGrad = ctx.createRadialGradient(310, 220, 0, 310, 220, 30);
    orbGrad.addColorStop(0, '#c8a84b');
    orbGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = orbGrad;
    ctx.fillRect(0, 0, 640, 420);
    ctx.restore();
  }
}

function drawClearing(t) {
  // lighter fog clearing
  const grad = ctx.createLinearGradient(0, 0, 0, 420);
  grad.addColorStop(0, '#060b06');
  grad.addColorStop(0.5, '#0f1f0f');
  grad.addColorStop(1, '#0a120a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 640, 420);

  // moonlight shaft
  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#a0d0a0';
  ctx.beginPath();
  ctx.moveTo(270, 0);
  ctx.lineTo(370, 0);
  ctx.lineTo(420, 420);
  ctx.lineTo(220, 420);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // ground
  ctx.fillStyle = '#080e08';
  ctx.fillRect(0, 340, 640, 80);

  // key (if not picked up)
  if (!state.hasKey) {
    const keyPulse = 0.6 + 0.4 * Math.sin(t / 600);
    ctx.save();
    ctx.globalAlpha = keyPulse;
    // glow
    const keyGrad = ctx.createRadialGradient(312, 262, 0, 312, 262, 25);
    keyGrad.addColorStop(0, 'rgba(200,168,75,0.6)');
    keyGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = keyGrad;
    ctx.fillRect(285, 240, 55, 45);
    ctx.restore();

    // draw key shape
    ctx.strokeStyle = '#c8a84b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(305, 262, 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(313, 262);
    ctx.lineTo(326, 262);
    ctx.lineTo(326, 268);
    ctx.lineTo(322, 268);
    ctx.lineTo(322, 265);
    ctx.stroke();
  }

  // nav buttons drawn on canvas
  // back button
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(140, 320, 120, 34);
  ctx.strokeStyle = '#2a5a2a';
  ctx.lineWidth = 1;
  ctx.strokeRect(140, 320, 120, 34);
  ctx.font = '20px VT323, monospace';
  ctx.fillStyle = '#4a8a4a';
  ctx.textAlign = 'center';
  ctx.fillText('[ ← go back ]', 200, 343);

  // forward button — gold if key picked up, grey if not
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(380, 320, 160, 34);
  ctx.strokeStyle = state.hasKey ? '#7a6020' : '#2a4a2a';
  ctx.lineWidth = 1;
  ctx.strokeRect(380, 320, 160, 34);
  ctx.font = '20px VT323, monospace';
  ctx.fillStyle = state.hasKey ? '#c8a84b' : '#2a5a2a';
  ctx.textAlign = 'center';
  ctx.fillText('[ continue → ]', 460, 343);

  // border trees
  [[60, 400, 50, 200], [540, 410, 55, 210], [10, 420, 40, 190], [610, 430, 45, 200]].forEach(([bx, by, bw, bh]) => {
    ctx.fillStyle = '#0a0f0a';
    ctx.fillRect(bx + bw/2 - 5, by - bh, 10, bh);
    ctx.fillStyle = '#0d1a0d';
    ctx.beginPath();
    ctx.moveTo(bx + bw/2, by - bh - 20);
    ctx.lineTo(bx - 5, by - bh + 70);
    ctx.lineTo(bx + bw + 5, by - bh + 70);
    ctx.closePath();
    ctx.fill();
  });
}

function drawDoor(t) {
  const grad = ctx.createLinearGradient(0, 0, 0, 420);
  grad.addColorStop(0, '#030508');
  grad.addColorStop(1, '#080810');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 640, 420);

  // ground
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 350, 640, 70);

  // door frame
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(255, 90, 130, 265);
  ctx.strokeStyle = '#1a1a2a';
  ctx.lineWidth = 3;
  ctx.strokeRect(255, 90, 130, 265);

  // door panels
  ctx.strokeStyle = '#141424';
  ctx.lineWidth = 1;
  ctx.strokeRect(265, 100, 110, 120);
  ctx.strokeRect(265, 230, 110, 115);

  // keyhole
  ctx.fillStyle = '#0a0a18';
  ctx.beginPath();
  ctx.arc(320, 220, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(317, 220, 6, 10);

  // if has key — door glows faintly
  if (state.hasKey) {
    const pulse = 0.4 + 0.6 * Math.sin(t / 700);
    ctx.save();
    ctx.globalAlpha = pulse * 0.3;
    const doorGlow = ctx.createRadialGradient(320, 222, 0, 320, 222, 80);
    doorGlow.addColorStop(0, '#c8a84b');
    doorGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = doorGlow;
    ctx.fillRect(240, 140, 160, 165);
    ctx.restore();

    // keyhole glow
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#c8a84b';
    ctx.beginPath();
    ctx.arc(320, 220, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // dark tree silhouettes
  [[80, 380, 40, 190], [560, 390, 42, 200], [20, 400, 35, 180], [620, 410, 38, 185]].forEach(([bx, by, bw, bh]) => {
    ctx.fillStyle = '#060608';
    ctx.beginPath();
    ctx.moveTo(bx + bw/2, by - bh);
    ctx.lineTo(bx, by);
    ctx.lineTo(bx + bw, by);
    ctx.closePath();
    ctx.fill();
  });

  // back button on canvas
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(60, 320, 140, 34);
  ctx.strokeStyle = '#2a3a2a';
  ctx.lineWidth = 1;
  ctx.strokeRect(60, 320, 140, 34);
  ctx.font = '20px VT323, monospace';
  ctx.fillStyle = '#3a6a3a';
  ctx.textAlign = 'center';
  ctx.fillText('[ ← turn back ]', 130, 343);

  // text above door
  ctx.save();
  ctx.globalAlpha = 0.3 + 0.2 * Math.sin(t / 1200);
  ctx.font = '14px VT323, monospace';
  ctx.fillStyle = '#3a3a5a';
  ctx.textAlign = 'center';
  ctx.fillText('you weren\'t gone. you were just somewhere i couldn\'t follow.', 320, 75);
  ctx.restore();
}

function drawFall(t, dt) {
  const p = state.sunPhase;
  const progress = Math.min(p / TOTAL_TICKS, 1);

  // ── Rainbow flash zone ──────────────────────────────────────────────────────
  const inRainbow = p >= RAINBOW_START && p <= RAINBOW_END;
  if (inRainbow) {
    const flashSpeed = 6;
    const hue = (p * flashSpeed) % 360;
    ctx.fillStyle = `hsl(${hue}, 100%, 55%)`;
    ctx.fillRect(0, 0, 640, 420);

    // stripes
    for (let s = 0; s < 7; s++) {
      ctx.fillStyle = `hsl(${(hue + s * 51) % 360}, 100%, 55%)`;
      ctx.fillRect(0, s * 60, 640, 60);
    }

    // white flicker overlaid every ~5 ticks
    if (p % 5 < 2) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 640, 420);
      ctx.restore();
    }

    state.sunPhase++;
    state.shake = 6 + Math.random() * 6;
    return; // skip rest of drawing during rainbow
  }

  // ── Phase-based background ──────────────────────────────────────────────────
  // Split progress across pre-rainbow portion only (p < RAINBOW_START)
  const bgProgress = Math.min(p / RAINBOW_START, 1);

  let bgR, bgG, bgB;
  if (bgProgress < 0.45) {
    const t0 = bgProgress / 0.45;
    bgR = Math.floor(t0 * 110);
    bgG = Math.floor(t0 * 18);
    bgB = Math.floor(t0 * 8);
  } else if (bgProgress < 0.85) {
    const t1 = (bgProgress - 0.45) / 0.4;
    bgR = Math.floor(110 + t1 * 145);
    bgG = Math.floor(18  + t1 * 170);
    bgB = Math.floor(8   + t1 * 50);
  } else {
    const t2 = (bgProgress - 0.85) / 0.15;
    bgR = 255;
    bgG = Math.floor(188 + t2 * 40);
    bgB = Math.floor(58  + t2 * 80);
  }

  // Post-rainbow: hold black (video sequence fires immediately after)
  if (p > RAINBOW_END) {
    bgR = 0; bgG = 0; bgB = 0;
  }

  ctx.fillStyle = `rgb(${bgR},${bgG},${bgB})`;
  ctx.fillRect(0, 0, 640, 420);

  // ── Sun ─────────────────────────────────────────────────────────────────────
  if (p < RAINBOW_START) {
    const sunR = bgProgress * 380;
    if (sunR > 2) {
      const sunGrad = ctx.createRadialGradient(320, 210, 0, 320, 210, sunR);
      sunGrad.addColorStop(0,   '#ffffff');
      sunGrad.addColorStop(0.2, '#fff8cc');
      sunGrad.addColorStop(0.5, '#ffcc44');
      sunGrad.addColorStop(0.8, '#ff6600');
      sunGrad.addColorStop(1,   'transparent');
      ctx.fillStyle = sunGrad;
      ctx.fillRect(0, 0, 640, 420);
    }

    // rotating rays (mid phase)
    if (bgProgress > 0.35 && bgProgress < 0.9) {
      const rayAlpha = Math.sin((bgProgress - 0.35) / 0.55 * Math.PI) * 0.12;
      ctx.save();
      ctx.globalAlpha = rayAlpha;
      for (let r = 0; r < 12; r++) {
        const angle = (r / 12) * Math.PI * 2 + p * 0.003;
        ctx.beginPath();
        ctx.moveTo(320, 210);
        ctx.lineTo(320 + Math.cos(angle) * 700, 210 + Math.sin(angle) * 700);
        ctx.strokeStyle = '#ffee88';
        ctx.lineWidth = 20;
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── Screen grain (mid zone) ─────────────────────────────────────────────────
  if (bgProgress > 0.5 && p < RAINBOW_START) {
    const grainAlpha = Math.sin((bgProgress - 0.6) / 0.4 * Math.PI) * 0.05;
    ctx.save();
    ctx.globalAlpha = grainAlpha;
    for (let i = 0; i < 200; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#ff8800';
      ctx.fillRect(Math.random() * 640, Math.random() * 420, 2, 2);
    }
    ctx.restore();
  }

  // ── Advance ─────────────────────────────────────────────────────────────────
  state.sunPhase++;

  // Shake: builds mid-fall, ramps hard into rainbow
  if (p > 1800 && p < RAINBOW_START - 100) {
    state.shake = 1 + Math.random() * 2;
  } else if (p > RAINBOW_START - 100 && p < RAINBOW_START) {
    state.shake = 3 + Math.random() * 4; // ramp up into rainbow
  } else if (p > RAINBOW_END) {
    state.shake = 0;
  } else {
    state.shake = 0;
  }

  if (p > TOTAL_TICKS) triggerEnd();
}

// ─── Video clip system ────────────────────────────────────────────────────────
// Drop your clips in /video/ and list them here.
// Supported: .mp4, .webm (use .mp4 for best browser support)
const VIDEO_CLIPS = [
  'video/clip1.mp4',
  'video/clip2.mp4',
  'video/clip3.mp4',
];

// Placeholder screens shown when video files aren't found yet
const PLACEHOLDERS = [
  { label: 'CLIP 01', duration: 3000, bg: '#0a0005', tint: '#3a0030' },
  { label: 'CLIP 02', duration: 3000, bg: '#000a05', tint: '#003a20' },
  { label: 'CLIP 03', duration: 3000, bg: '#05000a', tint: '#20003a' },
];

// Fade between clips (ms)
const CLIP_CROSSFADE = 400;
// Fade to black after last clip (ms)
const FADE_TO_BLACK = 1500;

let ended = false;
function triggerEnd() {
  if (ended) return;
  ended = true;
  stopSong(2000);
  playVideoSequence();
}

function playVideoSequence() {
  const overlay = document.getElementById('video-overlay');
  const player  = document.getElementById('video-player');
  const fadEl   = document.getElementById('video-fade');

  overlay.style.display = 'block';

  // Try loading the first clip — if it errors, use placeholder mode
  const testVid = new Audio(VIDEO_CLIPS[0]);
  testVid.addEventListener('error', () => runPlaceholders());
  testVid.addEventListener('canplay', () => runRealClips());
  testVid.src = VIDEO_CLIPS[0];

  function runRealClips() {
    const clips = VIDEO_CLIPS.filter(Boolean);
    let index = 0;

    function playClip(i) {
      if (i >= clips.length) {
        fadEl.style.transition = `opacity ${FADE_TO_BLACK}ms ease`;
        fadEl.style.opacity = '1';
        setTimeout(showEndScreen, FADE_TO_BLACK);
        return;
      }
      if (i > 0) {
        fadEl.style.transition = `opacity ${CLIP_CROSSFADE / 2}ms ease`;
        fadEl.style.opacity = '1';
      }
      setTimeout(() => {
        player.src = clips[i];
        player.load();
        player.play().catch(() => {});
        fadEl.style.transition = `opacity ${CLIP_CROSSFADE / 2}ms ease`;
        fadEl.style.opacity = '0';
        player.onended = () => playClip(i + 1);
        player.onerror = () => setTimeout(() => playClip(i + 1), 8000);
      }, i > 0 ? CLIP_CROSSFADE / 2 : 0);
    }
    playClip(0);
  }

  function runPlaceholders() {
    // hide the video element, draw placeholder on the overlay canvas instead
    player.style.display = 'none';

    const phCanvas = document.createElement('canvas');
    phCanvas.width  = 640;
    phCanvas.height = 420;
    phCanvas.style.cssText = 'width:100%;height:100%;image-rendering:pixelated;position:absolute;top:0;left:0;';
    overlay.appendChild(phCanvas);
    const phCtx = phCanvas.getContext('2d');

    let index = 0;
    let startTime = null;
    let fadeOutStarted = false;

    function drawPlaceholder(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      const ph = PLACEHOLDERS[index];

      // background
      phCtx.fillStyle = ph.bg;
      phCtx.fillRect(0, 0, 640, 420);

      // animated tint gradient
      const pulse = 0.3 + 0.2 * Math.sin(ts / 800);
      const g = phCtx.createRadialGradient(320, 210, 0, 320, 210, 300);
      g.addColorStop(0, ph.tint);
      g.addColorStop(1, 'transparent');
      phCtx.save();
      phCtx.globalAlpha = pulse;
      phCtx.fillStyle = g;
      phCtx.fillRect(0, 0, 640, 420);
      phCtx.restore();

      // scan lines
      phCtx.save();
      phCtx.globalAlpha = 0.07;
      for (let y = 0; y < 420; y += 4) {
        phCtx.fillStyle = '#000000';
        phCtx.fillRect(0, y, 640, 2);
      }
      phCtx.restore();

      // label
      phCtx.save();
      phCtx.globalAlpha = 0.25;
      phCtx.font = '13px VT323, monospace';
      phCtx.fillStyle = '#ffffff';
      phCtx.textAlign = 'center';
      phCtx.fillText(`[ ${ph.label} — replace with video/clip${index+1}.mp4 ]`, 320, 210);
      phCtx.restore();

      // noise grain
      phCtx.save();
      phCtx.globalAlpha = 0.04;
      for (let i = 0; i < 150; i++) {
        phCtx.fillStyle = '#ffffff';
        phCtx.fillRect(Math.random() * 640, Math.random() * 420, 2, 2);
      }
      phCtx.restore();

      // advance when duration hit
      if (elapsed >= ph.duration) {
        startTime = null;
        index++;
        if (index >= PLACEHOLDERS.length) {
          // fade to black and end
          fadEl.style.transition = `opacity ${FADE_TO_BLACK}ms ease`;
          fadEl.style.opacity = '1';
          setTimeout(showEndScreen, FADE_TO_BLACK);
          return;
        }
        // crossfade between placeholders
        fadEl.style.transition = `opacity ${CLIP_CROSSFADE / 2}ms ease`;
        fadEl.style.opacity = '1';
        setTimeout(() => {
          fadEl.style.transition = `opacity ${CLIP_CROSSFADE / 2}ms ease`;
          fadEl.style.opacity = '0';
        }, CLIP_CROSSFADE / 2);
      }

      requestAnimationFrame(drawPlaceholder);
    }

    requestAnimationFrame(drawPlaceholder);
  }
}

function showEndScreen() {
  const endEl = document.getElementById('end-screen');
  endEl.style.display = 'flex';
  document.getElementById('restart-btn').addEventListener('click', () => location.reload());
}

// ─── Path trapezoid hit-test ──────────────────────────────────────────────────
// Path vertices: (240,420) (280,335) (360,335) (400,420)
function pointInPath(px, py) {
  const verts = [{x:240,y:420},{x:280,y:335},{x:360,y:335},{x:400,y:420}];
  let inside = false;
  for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
    const xi = verts[i].x, yi = verts[i].y;
    const xj = verts[j].x, yj = verts[j].y;
    if (((yi > py) !== (yj > py)) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) {
      inside = !inside;
    }
  }
  return inside;
}

// ─── Hover detection ──────────────────────────────────────────────────────────
function getHovered() {
  const items = clickables[state.scene] || [];
  for (const item of items) {
    if (item.isPath) {
      if (pointInPath(mx, my)) return item;
    } else if (mx >= item.x && mx <= item.x + item.w && my >= item.y && my <= item.y + item.h) {
      return item;
    }
  }
  return null;
}

// ─── Click handling ───────────────────────────────────────────────────────────
canvas.addEventListener('click', () => {
  if (state.scene === 3) return;
  const h = getHovered();
  if (h) h.action();
});

// ─── Draw hover labels ────────────────────────────────────────────────────────
function drawHover() {
  const h = getHovered();
  if (!h) { cursorEl.style.color = '#4a8a4a'; return; }
  cursorEl.style.color = '#c8a84b';
  ctx.save();
  ctx.font = '16px VT323, monospace';
  ctx.fillStyle = '#c8a84b';
  ctx.textAlign = 'left';
  const lx = Math.min(mx + 14, 580);
  const ly = Math.max(my - 8, 20);
  ctx.fillText(h.label, lx, ly);
  ctx.restore();
}

// ─── Draw clickable zones (debug: off) ───────────────────────────────────────
// function drawZones() { ... }

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastT = 0;
function loop(t) {
  const dt = t - lastT;
  lastT = t;

  ctx.save();
  if (state.shake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * state.shake,
      (Math.random() - 0.5) * state.shake
    );
  }

  switch(state.scene) {
    case 0: drawForest(t); break;
    case 1: drawClearing(t); break;
    case 2: drawDoor(t); break;
    case 3: drawFall(t, dt); break;
  }

  // Draw nav arrows for scenes 0,1,2
  if (state.scene < 3) drawHover();

  ctx.restore();
  requestAnimationFrame(loop);
}

// ─── Mute button ──────────────────────────────────────────────────────────────
document.getElementById('mute-btn').addEventListener('click', () => {
  const btn = document.getElementById('mute-btn');
  audio.muted = !audio.muted;
  if (audio.ambient) audio.ambient.muted = audio.muted;
  if (audio.song)    audio.song.muted    = audio.muted;
  btn.style.color  = audio.muted ? '#4a2a2a' : '#2a5a2a';
  btn.textContent  = audio.muted ? '✕' : '♪';
});

// ─── Ambient starts on first interaction (title screen) ───────────────────────
let ambientStarted = false;
function tryStartAmbient() {
  if (ambientStarted) return;
  ambientStarted = true;
  initAudio();
  playAmbient();
}
document.getElementById('title-screen').addEventListener('mousemove', tryStartAmbient, { once: true });
document.getElementById('title-screen').addEventListener('click', tryStartAmbient);

// ─── Start button ─────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('title-screen').style.display = 'none';
  showMessage('the forest is quiet. it has been waiting for you.', 4000);
  tryStartAmbient(); // fallback in case mousemove didn't fire
  requestAnimationFrame(loop);
});

// ─── Initial render (behind title) ───────────────────────────────────────────
requestAnimationFrame(t => { drawForest(t); });
</script>
